{% extends 'users/base.html' %}
{% load static %}

<!-- {% block title %}Liste des emprunteurs{% endblock %} -->

{% block css %}
<link rel="stylesheet" href="{% static 'users/css/style.css' %}" >
{% endblock %}

{% block user_content %}
    <div class="cards">
    {% for user in emprunteurs %}
        <div class="user-card">
            <p>{{ user.prenom }} {{ user.nom }}<br></p>
            <p>{{ user.email }}<br></p>
            <p>{{ user.role }} {{ user.numero_adherent }}</p>
        </div>
    {% endfor %}
    </div>
{% endblock %}
