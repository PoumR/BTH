<header class="site-header">
    <div class="nav-inner">
        <a class="site-logo" href="{% url 'accueil' %}">
            <span class="logo-mark">B.</span>
            <span>Bibliothèque <small>de quartier</small></span>
        </a>
        <nav aria-label="Navigation principale" class="main-nav">
            <a href="{% url 'accueil' %}">Accueil</a>
            <a href="{% url 'catalogue:liste_livres' %}">Catalogue</a>
            {% if user.is_authenticated %}
                <a href="{% url 'reservation:liste_reservations' %}">Mes demandes</a>
                {% if user.role == 'gestionnaire' or user.is_staff or user.is_superuser %}
                    <a href="{% url 'reservation:gestion' %}">Gestion</a>
                {% endif %}
                <form method="post" action="{% url 'deconnexion' %}">
                    {% csrf_token %}
                    <button type="submit" class="nav-button">Déconnexion</button>
                </form>
            {% else %}
                <a href="{% url 'connexion' %}">Connexion</a>
                <a href="{% url 'inscription' %}" class="nav-signup">S'inscrire</a>
            {% endif %}
        </nav>
    </div>
</header>
