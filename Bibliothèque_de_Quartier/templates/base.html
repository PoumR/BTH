{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}" >
    {% block css %}
    {% endblock %}
    <title>{% block title %}Bibliothèque de quartier{% endblock %}</title>
</head>
<body>
    <div class="block_content">
        {% include "includes/header.html" %}
        <main class="site-main">
            {% if messages %}<div class="messages" aria-live="polite">{% for message in messages %}<div
                    class="message message-{{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}
            {% block content %}{% endblock %}
        </main>
        {% include "includes/footer.html" %}
    </div>
</body>
</html>
